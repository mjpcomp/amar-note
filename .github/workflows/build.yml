# Amar Note — Arduino firmware CI + release builder
#
# On every push to any branch:  compiles the firmware (smoke-test)
# On every tag push (v*.*.*):   compiles + creates a GitHub Release with
#                               the .bin attached as a release asset.
#
# The on-device OTA check hits:
#   GET api.github.com/repos/mjpcomp/amar-note/releases/latest
# and looks for the first .bin asset — exactly what this workflow produces.

name: Build Firmware

on:
  push:
    branches: [ '**' ]   # all branches — smoke-test every push
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Install + configure arduino-cli ──────────────────────────────
      - name: Install and configure arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      # ── 3. Install ESP32 Arduino core ──────────────────────────────────
      # 3.2.0 = IDF 5.3 — required for driver/i2c_master.h used in the sketch.
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.0

      # ── 4. Install libraries ───────────────────────────────────────────────────
      - name: Install libraries
        run: |
          arduino-cli lib install \
            "ArduinoJson@7.3.1" \
            "Adafruit GFX Library"

      # ── 5. Create secrets.h stub ─────────────────────────────────────────
      - name: Create secrets.h stub
        run: |
          cat > amar_note/secrets.h << 'EOF'
          // CI stub — placeholder values; firmware uses NVS at runtime.
          #pragma once
          #define WIFI_SSID  "...."
          #define WIFI_PASS  "...."
          #define OPENAI_KEY "...."
          EOF

      # ── 6. Compile ─────────────────────────────────────────────────────────
      # IMPORTANT: arduino-cli does NOT resolve `build.partitions=name` against
      # the sketch directory — use `build.custom_partitions` with the absolute
      # path to the project CSV so the 3 MB OTA slots are used.
      - name: Compile firmware
        run: |
          PARTITIONS_PATH="${{ github.workspace }}/amar_note/partitions.csv"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PartitionScheme=custom \
            --build-property "build.custom_partitions=${PARTITIONS_PATH}" \
            --export-binaries \
            amar_note/amar_note.ino

      # ── 7. Select correct binary for OTA ───────────────────────────────────
      # arduino-cli --export-binaries produces several .bin files:
      #   *.ino.bin          <- standard app image (offset 0x10000) — THIS is
      #                         what Update.h needs for OTA flashing.
      #   *.ino.ota.bin      <- raw image with no descriptor, for esptool only.
      #   *.ino.merged.bin   <- full flash image (bootloader + parts + app).
      #   *.ino.bootloader.bin / *.ino.partitions.bin
      #
      # Using the .ota.bin or .merged.bin causes Update.end() to fail:
      #   E esp_image: invalid segment length 0xffffffff
      #   Could Not Activate The Firmware
      # because esp_image validation expects the standard app image format.
      #
      # Fix: match *.ino.bin and explicitly exclude the ota/merged variants.
      - name: Select and rename binary
        run: |
          BIN=$(find amar_note/build -name '*.ino.bin' \
                  ! -name '*.ota.bin' \
                  ! -name '*.merged.bin' \
                  ! -name '*bootloader*' \
                  ! -name '*partitions*' \
                | head -1)
          echo "Selected binary: $BIN"
          ls -lh amar_note/build/ || true
          cp "$BIN" amar-note-firmware.bin

      # ── 8. Upload artifact (every build) ──────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amar-note-firmware
          path: amar-note-firmware.bin
          retention-days: 30

      # ── 9. Create GitHub Release (tag pushes only) ────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: amar-note-firmware.bin
          generate_release_notes: true
          name: "Amar Note ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
