# Amar Note — Arduino firmware CI + release builder
#
# On every push to any branch:  compiles the firmware (smoke-test)
# On every tag push (v*.*.*):   compiles + creates a GitHub Release with
#                               the .bin attached as a release asset.
#
# The on-device OTA check hits:
#   GET api.github.com/repos/mjpcomp/amar-note/releases/latest
# and looks for the first .bin asset — exactly what this workflow produces.

name: Build Firmware

on:
  push:
    branches: [ '**' ]   # all branches — smoke-test every push
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Install + configure arduino-cli ──────────────────────────────
      # Install to /usr/local/bin so it is on PATH for all subsequent steps.
      - name: Install and configure arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      # ── 3. Install ESP32 Arduino core ──────────────────────────────────
      # 3.2.0 = IDF 5.3 — required for driver/i2c_master.h used in the sketch.
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.0

      # ── 4. Install libraries from Arduino Library Manager ─────────────────
      # Rules:
      #   - Only libs that exist in the Library Manager index go here.
      #   - WebServer, HTTPUpdate, WiFiClientSecure, SD_MMC, FS ship with
      #     esp32:esp32 — do NOT list them here, arduino-cli will error.
      #   - BSP headers (i2c_bsp, audio_bsp, epaper_driver_bsp, usb_msc)
      #     are project-local source files, not external libraries.
      - name: Install libraries
        run: |
          arduino-cli lib install \
            "ArduinoJson@7.3.1" \
            "Adafruit GFX Library"

      # ── 5. Create secrets.h stub (CI build — no real keys needed) ─────────
      - name: Create secrets.h stub
        run: |
          cat > amar_note/secrets.h << 'EOF'
          // CI stub — no real secrets; firmware uses NVS at runtime
          #pragma once
          EOF

      # ── 6. Compile ─────────────────────────────────────────────────────────
      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PartitionScheme=custom \
            --build-property build.partitions=partitions \
            --export-binaries \
            amar_note/amar_note.ino

      # ── 7. Rename .bin for clarity ─────────────────────────────────────────
      - name: Rename binary
        run: |
          BIN=$(find amar_note/build -name '*.bin' ! -name '*bootloader*' ! -name '*partitions*' | head -1)
          echo "Found binary: $BIN"
          cp "$BIN" amar-note-firmware.bin

      # ── 8. Upload artifact (every build) ──────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amar-note-firmware
          path: amar-note-firmware.bin
          retention-days: 30

      # ── 9. Create GitHub Release (tag pushes only) ────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: amar-note-firmware.bin
          generate_release_notes: true
          name: "Amar Note ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
